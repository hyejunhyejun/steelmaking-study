<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, 'Malgun Gothic', sans-serif">
  <rect width="720" height="330" fill="#ffffff"/>

  <!-- ================= 문제(왼쪽): 빈 도표 ================= -->
  <g transform="translate(20,26)">
    <text x="8" y="0" font-size="11" fill="#555">100%</text>
    <line x1="34" y1="6" x2="34" y2="220" stroke="#333" stroke-width="1.6"/>
    <line x1="34" y1="220" x2="300" y2="220" stroke="#333" stroke-width="1.6"/>
    <text x="60" y="238" font-size="11" fill="#555">300</text>
    <text x="236" y="238" font-size="11" fill="#555">1,000</text>
    <text x="272" y="238" font-size="11" fill="#555">100%</text>
    <!-- A / B 영역 표시 + 압력 방향 화살표 -->
    <text x="92" y="92" font-size="15" font-weight="700" fill="#22405e">A</text>
    <text x="212" y="92" font-size="15" font-weight="700" fill="#22405e">B</text>
    <text x="56" y="126" font-size="11" fill="#c0392b">압력 감소</text>
    <line x1="132" y1="122" x2="106" y2="122" stroke="#c0392b" stroke-width="1.4"/>
    <polygon points="106,122 114,118 114,126" fill="#c0392b"/>
    <text x="196" y="126" font-size="11" fill="#0b6" >압력 증가</text>
    <line x1="160" y1="122" x2="190" y2="122" stroke="#0b6" stroke-width="1.4"/>
    <polygon points="190,122 182,118 182,126" fill="#0b6"/>
    <text x="120" y="272" font-size="13" font-weight="700" fill="#333">문제</text>
  </g>

  <!-- ================= 답(오른쪽): 곡선 3개 ================= -->
  <g transform="translate(380,26)">
    <line x1="34" y1="6" x2="34" y2="220" stroke="#333" stroke-width="1.6"/>
    <line x1="34" y1="220" x2="300" y2="220" stroke="#333" stroke-width="1.6"/>
    <text x="60" y="238" font-size="11" fill="#555">300</text>
    <text x="222" y="238" font-size="11" fill="#555">1,000</text>
    <text x="264" y="238" font-size="11" fill="#555">100%</text>

    <!-- 압력 감소(왼쪽으로 이동) -->
    <path d="M44,214 C74,210 92,190 108,140 C122,96 140,40 186,30"
          fill="none" stroke="#c0392b" stroke-width="2.2"/>
    <!-- 기준 곡선 -->
    <path d="M78,214 C108,210 126,190 142,140 C156,96 174,40 220,30"
          fill="none" stroke="#333" stroke-width="2.2"/>
    <!-- 압력 증가(오른쪽으로 이동) -->
    <path d="M112,214 C142,210 160,190 176,140 C190,96 208,40 254,30"
          fill="none" stroke="#0b6" stroke-width="2.2"/>

    <text x="66" y="60" font-size="15" font-weight="700" fill="#22405e">A</text>
    <text x="238" y="60" font-size="15" font-weight="700" fill="#22405e">B</text>
    <text x="44" y="112" font-size="11" fill="#c0392b">압력 감소</text>
    <line x1="120" y1="150" x2="92" y2="150" stroke="#c0392b" stroke-width="1.4"/>
    <polygon points="92,150 100,146 100,154" fill="#c0392b"/>
    <text x="196" y="176" font-size="11" fill="#0b6">압력 증가</text>
    <line x1="166" y1="166" x2="196" y2="166" stroke="#0b6" stroke-width="1.4"/>
    <polygon points="196,166 188,162 188,170" fill="#0b6"/>
    <text x="132" y="272" font-size="13" font-weight="700" fill="#c0392b">답</text>
  </g>

  <text x="20" y="322" font-size="10" fill="#999">※ 압력 증가 → 곡선 우측 이동(2CO → CO₂ + C, Carbon Deposition 활발) / 압력 감소 → 좌측 이동</text>
</svg>
