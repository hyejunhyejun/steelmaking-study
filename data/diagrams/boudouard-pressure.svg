<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="system-ui, 'Malgun Gothic', sans-serif">
  <rect width="560" height="330" fill="#ffffff"/>
  <!-- 축 -->
  <line x1="72" y1="266" x2="520" y2="266" stroke="#333" stroke-width="1.5"/>
  <line x1="72" y1="266" x2="72" y2="46" stroke="#333" stroke-width="1.5"/>
  <text x="28" y="160" font-size="13" fill="#333" transform="rotate(-90 34,160)">CO (%)</text>
  <text x="452" y="290" font-size="12" fill="#555">온도(℃)</text>
  <g font-size="11" fill="#666" text-anchor="middle">
    <text x="120" y="284">300</text>
    <text x="240" y="284">600</text>
    <text x="360" y="284">800</text>
    <text x="470" y="284">1,000</text>
  </g>
  <g font-size="11" fill="#666" text-anchor="end">
    <text x="66" y="60">100</text>
    <text x="66" y="270">0</text>
  </g>
  <!-- 기준 곡선 (1atm) -->
  <path d="M96,258 C180,254 230,232 272,168 C310,110 360,66 470,56"
        fill="none" stroke="#1f6feb" stroke-width="2.6"/>
  <text x="286" y="146" font-size="11" fill="#1f6feb">1atm</text>
  <!-- 압력 증가 → 우측 이동 (점선) -->
  <path d="M150,258 C234,254 284,232 326,168 C364,110 414,66 508,58"
        fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="7 4"/>
  <text x="376" y="196" font-size="12" fill="#c0392b">압력 증가 → 우측 이동</text>
  <line x1="300" y1="212" x2="352" y2="212" stroke="#c0392b" stroke-width="1.6"/>
  <polygon points="352,212 343,207 343,217" fill="#c0392b"/>
  <!-- 압력 감소 → 좌측 이동 (점선) -->
  <path d="M84,250 C140,244 190,222 226,162 C262,104 314,62 424,54"
        fill="none" stroke="#0b8457" stroke-width="2.2" stroke-dasharray="7 4"/>
  <text x="96" y="104" font-size="12" fill="#0b8457">압력 감소 → 좌측 이동</text>
  <line x1="220" y1="122" x2="172" y2="122" stroke="#0b8457" stroke-width="1.6"/>
  <polygon points="172,122 181,117 181,127" fill="#0b8457"/>
  <!-- A / B 영역 -->
  <text x="132" y="120" font-size="17" font-weight="700" fill="#22405e">A</text>
  <text x="396" y="240" font-size="17" font-weight="700" fill="#22405e">B</text>
  <text x="120" y="140" font-size="11" fill="#4b6a8c">2CO → CO₂ + C</text>
  <text x="352" y="256" font-size="11" fill="#4b6a8c">CO₂ + C → 2CO</text>
  <text x="150" y="32" font-size="13" fill="#333">부두아 곡선 — 압력 변화에 따른 이동</text>
  <text x="72" y="312" font-size="11" fill="#999">※ 개념도 — 압력 증가 시 Carbon Deposition(2CO → CO₂ + C) 활발</text>
</svg>
