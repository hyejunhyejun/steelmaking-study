<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="system-ui, 'Malgun Gothic', sans-serif">
  <rect width="520" height="300" fill="#ffffff"/>
  <!-- 축 -->
  <line x1="70" y1="250" x2="470" y2="250" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="250" x2="70" y2="50" stroke="#333" stroke-width="1.5"/>
  <text x="26" y="150" font-size="13" fill="#333" transform="rotate(-90 34,150)">노벽온도</text>
  <text x="76" y="272" font-size="12" fill="#555">PS (압출기측)</text>
  <text x="386" y="272" font-size="12" fill="#555">CS (가이드차측)</text>
  <!-- 온도 곡선: PS에서 낮고 CS쪽으로 상승 후 끝에서 하강 -->
  <path d="M70,214 C140,150 210,120 300,108 C350,101 396,100 420,104 L420,150"
        fill="none" stroke="#1f6feb" stroke-width="2.5"/>
  <!-- 각 Flue 위치 점선 -->
  <g stroke="#ddd" stroke-dasharray="3 3">
    <line x1="140" y1="250" x2="140" y2="152"/>
    <line x1="210" y1="250" x2="210" y2="123"/>
    <line x1="280" y1="250" x2="280" y2="110"/>
    <line x1="350" y1="250" x2="350" y2="101"/>
  </g>
  <!-- ⓐ 온도차 표시(CS 끝단) -->
  <line x1="446" y1="104" x2="446" y2="150" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="440" y1="104" x2="452" y2="104" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="440" y1="150" x2="452" y2="150" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="470" cy="127" r="11" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="465" y="132" font-size="13" font-weight="700" fill="#c0392b">a</text>
  <text x="286" y="40" font-size="13" fill="#333">연소실 Flue별 온도분포 (PS ~ CS)</text>
  <text x="70" y="292" font-size="11" fill="#999">※ 개념도 — ⓐ 는 PS·CS 노벽온도 편차</text>
</svg>
