<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" font-family="system-ui, 'Malgun Gothic', sans-serif">
  <rect width="560" height="320" fill="#ffffff"/>
  <!-- 축 -->
  <line x1="70" y1="256" x2="530" y2="256" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="256" x2="70" y2="46" stroke="#333" stroke-width="1.5"/>
  <text x="26" y="160" font-size="13" fill="#333" transform="rotate(-90 32,160)">부피 팽창</text>
  <text x="470" y="278" font-size="12" fill="#555">온도(℃)</text>
  <!-- 상변태점 세로선 + 눈금 -->
  <g stroke="#c9c9c9" stroke-dasharray="4 3">
    <line x1="146" y1="256" x2="146" y2="196"/>
    <line x1="240" y1="256" x2="240" y2="166"/>
    <line x1="386" y1="256" x2="386" y2="124"/>
    <line x1="474" y1="256" x2="474" y2="76"/>
  </g>
  <!-- 계단형 상승 곡선 -->
  <path d="M70,244 L138,238 Q146,196 154,192 L232,186 Q240,166 248,162 L378,150
           Q386,124 394,120 L466,104 Q474,76 482,70 L520,62"
        fill="none" stroke="#1f6feb" stroke-width="2.5"/>
  <!-- 상변태 온도 라벨 -->
  <g font-size="12" fill="#c0392b" text-anchor="middle">
    <text x="146" y="274">573</text>
    <text x="240" y="274">870</text>
    <text x="386" y="274">1,470</text>
    <text x="474" y="274">1,713</text>
  </g>
  <!-- 상(相) 이름 -->
  <g font-size="12" fill="#31527a">
    <text x="86" y="228">α석영</text>
    <text x="168" y="180">β석영</text>
    <text x="264" y="150">β Tridymite</text>
    <text x="398" y="108">β Cristobalite</text>
    <text x="452" y="52">용융 Silica</text>
  </g>
  <!-- 최대 가열온도 표시 -->
  <circle cx="474" cy="76" r="6" fill="#c0392b"/>
  <text x="352" y="300" font-size="11" fill="#999">※ 개념도 — 각 점이 상변태 온도, 용융 직전이 최대 가열 한계</text>
  <text x="196" y="34" font-size="13" fill="#333">석영(SiO₂) 상변태 곡선</text>
</svg>
