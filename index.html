<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>제선기능장 실기 학습</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // 화면 깜빡임 방지: 렌더 전에 저장된 테마를 먼저 적용
    (function () {
      try {
        var t = localStorage.getItem("jeseon:theme");
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header>
    <h1>제선기능장 실기 학습</h1>
    <button id="theme-toggle" type="button" aria-label="다크모드 전환">🌙 다크</button>
  </header>
  <main id="app">로딩 중…</main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
